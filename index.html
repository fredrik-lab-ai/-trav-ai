<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRAV AI V56</title>
<style>
body{margin:0;background:#0d1117;color:#e6edf3;font:14px Arial,sans-serif}header{padding:22px;background:#111827;border-bottom:1px solid #263241}h1{margin:0;font-size:27px}main{max-width:1500px;margin:auto;padding:18px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{padding:12px 18px;border:1px solid #334155;border-radius:8px;background:#172554;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card,.race,.sys{background:#111827;border:1px solid #263241;border-radius:10px}.card{padding:14px}.label{color:#8190a4;font-size:11px;text-transform:uppercase}.val{font-size:22px;font-weight:900;margin-top:5px}.msg{padding:12px;border-radius:8px;background:#172033;margin:12px 0;display:none}.msg.show{display:block}.race{margin:20px 0;overflow:hidden}.rh{padding:14px;background:#151e2b;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.rn{font-size:18px;font-weight:900}.meta{color:#9aa8b9}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th{font-size:11px;color:#8492a4;text-align:left;background:#0d141e}td,th{padding:9px;border-bottom:1px solid #202b39}.top{font-weight:900}.pos{font-weight:900}.good{color:#4ade80}.warn{color:#fbbf24}.bad{color:#fb7185}.muted{color:#8190a4}.sys{padding:16px;margin-top:20px}.pick{display:inline-block;padding:5px 8px;background:#1c2634;border-radius:6px;margin:3px}.small{font-size:11px;color:#8190a4}
</style></head><body>
<header><h1>TRAV AI V56</h1><div class="muted">Historik som huvudsignal · marknad separat · race-level sannolikhet · ingen aktuell start används som historik</div></header>
<main><div class="bar"><button id="run">HÄMTA V85 & ANALYSERA</button><button id="sys">BYGG SYSTEM</button><button id="clear">RENSA</button></div><div id="msg" class="msg"></div><div class="cards"><div class="card"><div class="label">Bana</div><div id="track" class="val">–</div></div><div class="card"><div class="label">Lopp</div><div id="races" class="val">0</div></div><div class="card"><div class="label">Hästar</div><div id="horses" class="val">0</div></div><div class="card"><div class="label">Historik OK</div><div id="hist" class="val">0</div></div><div class="card"><div class="label">Täckning</div><div id="cov" class="val">0%</div></div><div class="card"><div class="label">V56</div><div id="ver" class="val">–</div></div></div><div id="results"></div><div id="system" class="sys" style="display:none"></div></main>
<script>
const API="https://trav-ai-proxy.fredrik-widingsel.workers.dev";let data=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(t){$('msg').textContent=t;$('msg').className='msg show'}
function clear(){data=null;$('results').innerHTML='';$('system').style.display='none';$('track').textContent='–';$('races').textContent='0';$('horses').textContent='0';$('hist').textContent='0';$('cov').textContent='0%';$('ver').textContent='–';$('msg').className='msg'}
function render(d){data=d;$('ver').textContent=d.version||'56';$('races').textContent=d.races_count||0;$('horses').textContent=d.horses_total||0;$('hist').textContent=d.history_ok||0;$('cov').textContent=(d.history_coverage??0)+'%';$('track').textContent=d.races?.[0]?.track||d.track||'Jägersro';let html='';for(const r of d.races||[]){html+=`<section class="race"><div class="rh"><div><div class="rn">${esc(r.name||('V85-'+r.number))}</div><div class="meta">${r.distance??'–'} m · ${esc(r.start_method||'–')} ${r.start_time?' · '+esc(r.start_time):''}</div></div><div class="meta">Datakvalitet: ${esc(r.data_quality||'–')}</div></div><div class="scroll"><table><thead><tr><th>#</th><th>Häst</th><th>AI %</th><th>V85 %</th><th>Historik</th><th>Form</th><th>Galopp</th><th>Bedömning</th></tr></thead><tbody>`;for(const h of r.horses||[]){html+=`<tr><td>${h.number}</td><td class="${h.ai_probability===Math.max(...(r.horses||[]).map(x=>x.ai_probability||0))?'top':''}">${esc(h.horse)}</td><td class="pos">${(h.ai_probability??0).toFixed(2)}%</td><td>${h.v??0}%</td><td>${h.history_count??0} <span class="small">${esc(h.data_quality||'')}</span></td><td>${h.form??'–'}</td><td>${h.gallops??'–'}</td><td>${esc(h.verdict||'')}</td></tr>`}html+='</tbody></table></div></section>'}$('results').innerHTML=html||'<div class="msg show">Ingen loppdata.</div>'}
function buildSystem(){if(!data?.races?.length)return;let html='<h2>Systemförslag</h2><div class="small">Modellbaserat urval. Marknad/V85 används inte som AI-feature.</div>';for(const r of data.races){const hs=(r.horses||[]).slice().sort((a,b)=>(b.ai_probability||0)-(a.ai_probability||0));const p=hs[0]?.ai_probability||0;let n=p>=32?1:p>=22?2:p>=15?3:4;html+=`<p><b>${esc(r.name)}</b> `+hs.slice(0,n).map(h=>`<span class="pick">${h.number} ${esc(h.horse)} (${(h.ai_probability||0).toFixed(1)}%)</span>`).join('')+'</p>'}$('system').innerHTML=html;$('system').style.display='block'}
$('run').onclick=async()=>{clear();$('run').disabled=true;msg('Hämtar och analyserar 2026-09-05…');try{const r=await fetch(API+'/analyze?date=2026-09-05',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!d.ok)throw Error(d.error||'Worker-fel');render(d);msg(`V${d.version}: ${d.races_count} lopp, ${d.horses_total} hästar, historiktäckning ${d.history_coverage}%.`)}catch(e){msg('Fel: '+e.message)}finally{$('run').disabled=false}};$('sys').onclick=buildSystem;$('clear').onclick=clear;
</script></body></html>
